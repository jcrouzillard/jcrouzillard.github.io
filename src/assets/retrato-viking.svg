<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Emblema em estilo xilogravura: silhueta do Julien em três tons (osso, bronze, ferro).
       Coque alto, mechas soltas até os ombros, cavanhaque, ombros largos. Trança com conta e pingente rúnico. -->
  <defs><clipPath id="c"><circle cx="120" cy="120" r="106"/></clipPath></defs>

  <!-- anel de ferro, aro de sangue e runas de bronze -->
  <circle cx="120" cy="120" r="118" fill="#15130f"/>
  <circle cx="120" cy="120" r="113" fill="none" stroke="#c9a24a" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#b8322a" stroke-width="3"/>
  <g font-family="'Noto Sans Runic', serif" font-size="8" fill="#c9a24a">
    <text x="120" y="11" text-anchor="middle" letter-spacing="3">ᛃᚢᛚᛁᛖᚾ</text>
    <text x="120" y="235" text-anchor="middle" letter-spacing="3">ᛒᚲᚱᛖᚹ</text>
  </g>

  <g clip-path="url(#c)">
    <rect width="240" height="240" fill="#15130f"/>
    <!-- raios de xilogravura ao fundo -->
    <g stroke="#2a2520" stroke-width="2">
      <path d="M120 120L20 40M120 120L10 120M120 120L20 200M120 120L220 40M120 120L230 120M120 120L220 200M120 120L60 10M120 120L180 10"/>
    </g>

    <!-- ombros (ferro mais claro) -->
    <path d="M6 240c4-46 44-70 84-78h60c40 8 80 32 84 78Z" fill="#2b2622"/>
    <path d="M6 240c4-46 44-70 84-78h60c40 8 80 32 84 78Z" fill="none" stroke="#c9a24a" stroke-width="1" opacity=".5"/>

    <!-- mechas soltas que caem até os ombros (bronze) -->
    <path d="M78 84c-14 26-14 56-2 82 10-4 16-10 18-18-10-20-10-42-4-62Z" fill="#8a6a34"/>
    <path d="M162 84c14 26 14 56 2 82-10-4-16-10-18-18 10-20 10-42 4-62Z" fill="#8a6a34"/>
    <g stroke="#5c4522" stroke-width="2" fill="none">
      <path d="M76 100c-6 20-6 40 2 58M164 100c6 20 6 40-2 58"/>
    </g>

    <!-- pescoço -->
    <path d="M98 134h44v32H98Z" fill="#d8c4a6"/>

    <!-- rosto (osso) -->
    <path d="M76 90c0-32 18-52 44-52s44 20 44 52c0 24-8 42-18 54-7 8-16 12-26 12s-19-4-26-12c-10-12-18-30-18-54Z" fill="#ece3d2"/>

    <!-- cabelo puxado para trás + coque (bronze com talhos escuros) -->
    <path d="M74 86c2-34 22-52 46-52s44 18 46 52c-8-18-24-28-46-28s-38 10-46 28Z" fill="#9a7a2e"/>
    <g stroke="#5c4522" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M86 70c10-8 22-12 34-12M104 60c6-3 12-4 16-4M138 62c6 2 12 5 16 9"/>
    </g>
    <circle cx="124" cy="30" r="15" fill="#9a7a2e"/>
    <path d="M112 30c4-8 20-8 24 0M114 24c6-4 14-4 20 0" fill="none" stroke="#5c4522" stroke-width="2" stroke-linecap="round"/>

    <!-- trança com conta de bronze -->
    <path d="M160 96c8 14 8 32 2 48" fill="none" stroke="#5c4522" stroke-width="6" stroke-linecap="round"/>
    <path d="M160 96c8 14 8 32 2 48" fill="none" stroke="#c9a24a" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <rect x="157" y="142" width="10" height="9" rx="2" fill="#c9a24a"/>

    <!-- feições em talho (sem olhos "fofos": sobrancelha firme e olhar de fenda) -->
    <g stroke="#15130f" stroke-linecap="round" fill="none">
      <path d="M90 86c8-6 18-6 26-2M150 86c-8-6-18-6-26-2" stroke-width="4.5"/>
      <path d="M94 97h16M130 97h16" stroke-width="3"/>
      <path d="M120 96c-4 12-6 18-3 22h6c3-4 1-10-3-22" stroke-width="2.2"/>
      <path d="M108 130c8 3 16 3 24 0" stroke-width="2.4"/>
    </g>

    <!-- bigode fino e cavanhaque (bronze) -->
    <path d="M104 123c6-4 10-5 16-5s10 1 16 5c-5 1-10 1-16 1s-11 0-16-1Z" fill="#8a6a34"/>
    <path d="M102 134c4 16 10 26 18 28 8-2 14-12 18-28-6 4-12 5-18 5s-12-1-18-5Z" fill="#8a6a34"/>
    <path d="M112 150c3 5 5 8 8 9 3-1 5-4 8-9" fill="none" stroke="#5c4522" stroke-width="1.6"/>

    <!-- pingente rúnico -->
    <path d="M100 166c6 10 34 10 40 0" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
    <path d="M120 174l-7 12h14Z" fill="#c9a24a"/>
  </g>
</svg>
